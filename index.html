<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album Gallery</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    .gallery {
      width: 100%;
      height: 500px;
      overflow-y: auto;
      overflow-x: hidden;
      background: #000;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 12px;
      box-sizing: border-box;
    }

    .gallery a {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #000;
    }

    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: transform 0.2s ease;
    }

    .gallery a:hover img {
      transform: scale(1.04);
    }

    .gallery::-webkit-scrollbar {
      width: 8px;
    }

    .gallery::-webkit-scrollbar-track {
      background: #000;
    }

    .gallery::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 10px;
    }

    .gallery::-webkit-scrollbar-thumb:hover {
      background: #666;
    }
  </style>
</head>
